<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Mobile / cellphone targeted viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Registration Check</title>

  <!-- IDS Enterprise Web Components (Infor Design System) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ids-enterprise-wc@1.17.1/themes/ids-theme-default-light.css" />
  <script type="module" src="https://cdn.jsdelivr.net/npm/ids-enterprise-wc@1.17.1/enterprise-wc.all.iife.js"></script>

  <style>
    :root {
      color-scheme: light;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Full-bleed Creative Day 2026 background, phone-oriented (portrait). */
    body {
      background-color: #eaf1fb;
      background-image: url("bg.png");
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    /*
     * Phone-first layout. The background art keeps its clear space in the
     * upper-middle and the "Creative Day 2026" logo lower down, so the card
     * is anchored toward the top to avoid covering the logo and the busy
     * graphics near the bottom.
     */
    .app-shell {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: calc(24px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));
      box-sizing: border-box;
    }

    .card {
      width: 100%;
      max-width: 400px;
      /* Frosted glass so the light-blue background reads through subtly. */
      background: rgba(255, 255, 255, 0.82);
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      backdrop-filter: blur(12px) saturate(140%);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(31, 78, 148, 0.18);
      padding: 26px 22px 30px;
      box-sizing: border-box;
      margin-top: 6vh;
    }

    .header {
      text-align: center;
      margin-bottom: 22px;
    }

    .header ids-text {
      display: block;
    }

    .header .subtitle {
      margin-top: 4px;
      color: #5b6b82;
    }

    .field {
      margin-bottom: 18px;
    }

    /* Full-width, thumb-friendly controls */
    ids-input,
    ids-button {
      width: 100%;
    }

    ids-button {
      margin-top: 4px;
    }

    #result {
      margin-top: 22px;
      min-height: 24px;
    }

    .result-box {
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }

    .result-box #confirm-btn {
      display: inline-block;
      margin-top: 14px;
    }

    .result-box.success {
      background: rgba(230, 244, 234, 0.95);
      border: 1px solid #b7dfc2;
    }

    .result-box.error {
      background: rgba(251, 234, 234, 0.95);
      border: 1px solid #f0c2c2;
    }

    .result-box.info {
      background: rgba(238, 242, 247, 0.95);
      border: 1px solid #d3dce6;
    }

    .config-warning {
      margin-top: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="card">
      <div class="header">
        <ids-text type="h1" font-size="26" font-weight="bold">Session Check-In</ids-text>
        <ids-text class="subtitle" type="span" font-size="14" color="unset">Creative Day 2026 &middot; Verify your registration</ids-text>
      </div>

      <form id="check-form" autocomplete="off" novalidate>
        <div class="field">
          <ids-input
            id="email"
            type="email"
            label="Please enter your email address"
            placeholder="you@example.com"
            size="full"
            autocomplete="email"
            inputmode="email"></ids-input>
        </div>

        <ids-button id="submit-btn" type="submit" appearance="primary">
          <span>Submit</span>
        </ids-button>
      </form>

      <div id="result" aria-live="polite"></div>

      <div id="config-warning" class="config-warning" hidden>
        <ids-text type="span" font-size="12" color="error">
          No session specified. Add <strong>?check=source1</strong> to the URL.
        </ids-text>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      // Read the "check" query string parameter -> determines which out/<check>.txt to compare against.
      const params = new URLSearchParams(window.location.search);
      const checkName = (params.get('check') || '').trim();

      const resultEl = document.getElementById('result');
      const warningEl = document.getElementById('config-warning');

      if (!checkName) {
        warningEl.hidden = false;
      }

      // Compute lowercase SHA-256 hex of a string using the Web Crypto API.
      async function sha256Hex(text) {
        const bytes = new TextEncoder().encode(text);
        const digest = await crypto.subtle.digest('SHA-256', bytes);
        return Array.from(new Uint8Array(digest))
          .map((b) => b.toString(16).padStart(2, '0'))
          .join('');
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function showResult(message, kind) {
        resultEl.innerHTML =
          '<div class="result-box ' + kind + '">' +
          '<ids-text type="span" font-size="16" font-weight="bold">' +
          message +
          '</ids-text></div>';
      }

      // Guard against path traversal in the check parameter; only allow safe file-name characters.
      function sanitizeCheckName(name) {
        return /^[A-Za-z0-9._-]+$/.test(name) ? name : null;
      }

      async function loadHashSet(name) {
        const response = await fetch('out/' + encodeURIComponent(name) + '.txt', { cache: 'no-store' });
        if (!response.ok) {
          throw new Error('HTTP ' + response.status);
        }
        const text = await response.text();
        const set = new Set();
        text.split(/\r?\n/).forEach((line) => {
          const trimmed = line.trim().toLowerCase();
          if (trimmed) {
            set.add(trimmed);
          }
        });
        return set;
      }

      // Minimal CSV field splitter that respects double-quoted fields.
      function splitCsvLine(line) {
        const fields = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (inQuotes) {
            if (ch === '"') {
              if (line[i + 1] === '"') { current += '"'; i++; }
              else { inQuotes = false; }
            } else {
              current += ch;
            }
          } else if (ch === '"') {
            inQuotes = true;
          } else if (ch === ',') {
            fields.push(current);
            current = '';
          } else {
            current += ch;
          }
        }
        fields.push(current);
        return fields;
      }

      // Look up a session row from SessionList.csv by its code (Column A).
      // Returns { name: <Column C>, url: <Column B> } or null if not found.
      async function lookupSession(code) {
        try {
          const response = await fetch('SessionList.csv', { cache: 'no-store' });
          if (!response.ok) {
            return null;
          }
          const text = await response.text();
          const target = code.trim().toLowerCase();
          const lines = text.split(/\r?\n/);
          for (const line of lines) {
            if (!line.trim()) { continue; }
            const cols = splitCsvLine(line);
            const colA = (cols[0] || '').trim();
            const colB = (cols[1] || '').trim();
            const colC = (cols[2] || '').trim();
            if (colA.toLowerCase() === target) {
              return { name: colC || null, url: colB || null };
            }
          }
          return null;
        } catch (err) {
          return null;
        }
      }

      // Only allow http(s) links from the CSV to be opened.
      function safeHttpUrl(url) {
        try {
          const parsed = new URL(url);
          return (parsed.protocol === 'https:' || parsed.protocol === 'http:') ? parsed.href : null;
        } catch (err) {
          return null;
        }
      }

      async function handleSubmit(event) {
        if (event) {
          event.preventDefault();
        }

        const emailInput = document.getElementById('email');
        const rawEmail = (emailInput.value || '').trim();

        if (!rawEmail) {
          showResult('Please enter your email address.', 'info');
          return;
        }

        if (!checkName) {
          showResult('No session specified in the link.', 'error');
          return;
        }

        const safeName = sanitizeCheckName(checkName);
        if (!safeName) {
          showResult('Invalid session identifier.', 'error');
          return;
        }

        showResult('Checking...', 'info');

        try {
          // Convert to lowercase, then encode to SHA-256.
          const emailLower = rawEmail.toLowerCase();
          const hash = await sha256Hex(emailLower);

          const hashSet = await loadHashSet(safeName);

          if (hashSet.has(hash)) {
            // Resolve the session (Columns B and C) from SessionList.csv using
            // the check code (Column A). Fall back to the code if not found.
            const session = await lookupSession(safeName);
            const sessionName = (session && session.name) || safeName;
            const confirmUrl = session && session.url ? safeHttpUrl(session.url) : null;

            // Hide the input form on a successful match.
            form.hidden = true;

            showResult(
              "You're registered in " + escapeHtml(sessionName) +
              "! Please confirm your attendance and come in!",
              'success'
            );

            // Add a "Confirm attendance" button that opens the Column B link.
            if (confirmUrl) {
              const resultBox = resultEl.querySelector('.result-box');
              const btn = document.createElement('ids-button');
              btn.setAttribute('id', 'confirm-btn');
              btn.setAttribute('appearance', 'primary');
              btn.textContent = 'Confirm attendance';
              btn.addEventListener('click', function () {
                window.open(confirmUrl, '_blank', 'noopener,noreferrer');
              });
              resultBox.appendChild(btn);
            }
          } else {
            showResult('Sorry you are not registered in this session.', 'error');
          }
        } catch (err) {
          showResult('Could not load session "' + checkName + '". ' + err.message, 'error');
        }
      }

      const form = document.getElementById('check-form');
      form.addEventListener('submit', handleSubmit);

      // IDS button emits a click; the surrounding form submit covers it, but bind directly too
      // in case the custom element does not forward the native submit in some browsers.
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.addEventListener('click', function (e) {
        // If the button is not acting as a native submit, trigger manually.
        if (e && e.target && e.target.getAttribute('type') !== 'submit') {
          handleSubmit(e);
        }
      });

      // Allow pressing Enter in the email field to submit.
      window.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          handleSubmit(e);
        }
      });
    })();
  </script>
</body>
</html>
